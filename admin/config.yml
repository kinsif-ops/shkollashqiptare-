backend:
  name: git-gateway
  branch: main

media_folder: "pdf"
public_folder: "/pdf"

locale: 'no'

collections:
  - name: "skoler"
    label: "Skoler"
    label_singular: "Skole"
    folder: "data/skoler"
    create: true
    delete: true
    identifier_field: "id"
    extension: "json"
    format: "json"
    fields:
      - { label: "ID (unik, ingen mellomrom)", name: "id", widget: "string" }
      - { label: "Skolenavn", name: "name", widget: "string" }
      - { label: "By", name: "city", widget: "string" }
      - { label: "Land", name: "country", widget: "string" }
      - { label: "Breddegrad (latitude)", name: "lat", widget: "number", value_type: "float" }
      - { label: "Lengdegrad (longitude)", name: "lng", widget: "number", value_type: "float" }
      - { label: "Antall elever", name: "elever", widget: "number" }
      - { label: "Lærere", name: "laerer", widget: "string" }
      - { label: "Grunnlagt (år)", name: "grunnlagt", widget: "number" }
      - { label: "Kontakt e-post", name: "kontakt", widget: "string" }
      - { label: "Undervisningstid", name: "ores", widget: "string" }
      - { label: "Adresse", name: "adresse", widget: "string" }

  - name: "bokstaver"
    label: "Bokstaver"
    label_singular: "Bokstav"
    folder: "data/bokstaver"
    create: true
    delete: true
    identifier_field: "bokstav"
    extension: "json"
    format: "json"
    fields:
      - { label: "Bokstav", name: "bokstav", widget: "string", hint: "F.eks. A, B, Dh, Gj" }
      - label: "Arbeidsark (PDF)"
        name: "arbeidsark"
        widget: "file"
        required: false
        media_folder: "/pdf"
        public_folder: "/pdf"
      - label: "Lærerveiledning (PDF)"
        name: "laererveiledning"
        widget: "file"
        required: false
        media_folder: "/pdf"
        public_folder: "/pdf"
      - label: "Foreldreark (PDF)"
        name: "foreldreark"
        widget: "file"
        required: false
        media_folder: "/pdf"
        public_folder: "/pdf"
      - label: "Lydfil (uttale)"
        name: "lydfil"
        widget: "file"
        required: false
        media_folder: "/audio"
        public_folder: "/audio"
      - { label: "Video-lenke (munnbevegelse)", name: "video", widget: "string", required: false, hint: "Lim inn YouTube-lenke eller annen video-URL" }

  - name: "materialer"
    label: "Materialer (PDF)"
    label_singular: "Materiale"
    folder: "data/materialer"
    create: true
    delete: true
    extension: "json"
    format: "json"
    fields:
      - { label: "Bokstav", name: "bokstav", widget: "string" }
      - { label: "Tittel", name: "tittel", widget: "string" }
      - { label: "Beskrivelse", name: "beskrivelse", widget: "text" }
      - { label: "Type", name: "type", widget: "select", options: ["Arbeidshefte", "Flashkort", "Lærerveiledning", "Poster", "Pakke"] }
      - { label: "Tilgjengelig nå", name: "tilgjengelig", widget: "boolean", default: false }
